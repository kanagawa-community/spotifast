name: Generated

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Fails when committed theme and skin files differ from what scripts/generate.py
  # writes from the shared palette. --check compares archive contents, not bytes:
  # the compressed bytes change with the zlib build.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kanagawa-community/.github
          path: .palette
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install pillow==13.0.0
      - run: '"$RUNNER_TEMP/venv/bin/python" scripts/generate.py --check .palette/palette.json'
